[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psd2ui"
version = "1.3.0"
description = "Photoshop-free layered PSD/PSB exporter for LayaAir 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psd-tools[composite]==1.17.4",
    "Pillow>=10.3,<14",
    "numpy>=1.26,<3",
    "loom-image9grid @ git+https://github.com/eggbbq/loom_image9grid.git@v1.1.1",
]

[project.urls]
Repository = "https://github.com/eggbbq/loom_psd2ui"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
psd2ui = "psd2ui.cli:main"
psd2ui-export = "psd2ui.run_export:main"
psd2ui-ui = "psd2ui.ui.cli:main"
psd2ui-ui-batch = "psd2ui.ui.batch_cli:main"
psd2ui-check-design = "psd2ui.ui.maintenance_cli:check_design_main"
psd2ui-migrate-images = "psd2ui.ui.maintenance_cli:migrate_names_main"
psd2ui-shared-images = "psd2ui.shared_images.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["psd2ui*"]
namespaces = false

[tool.setuptools.package-data]
psd2ui = ["ui/runtime/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

