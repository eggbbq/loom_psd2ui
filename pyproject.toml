[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psd2ui"
version = "1.0.0"
description = "Photoshop-free layered PSD/PSB exporter for LayaAir 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psd-tools[composite]==1.17.4", "Pillow>=10.3,<14", "numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/eggbbq/loom_psd2ui"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
psd2ui = "psd2ui.cli:main"
ninegrid = "ninegrid.__main__:main"
psd2ui-export = "psd2ui.run_export:main"
ninegrid-run = "ninegrid.run_9grid:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["psd2ui*", "ninegrid*"]
exclude = ["ninegrid.tests*"]
namespaces = false

[tool.setuptools.package-data]
ninegrid = ["engine_probe.mjs", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/ninegrid/tests"]

